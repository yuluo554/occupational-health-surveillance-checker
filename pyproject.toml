[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ohscheck"
version = "0.1.1"
description = "职业健康监护合规核查工作台（GBZ 188 双版本规则集·监护矩阵·批量对账）"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639：SPDX 表达式字符串（TOML 表写法已被 setuptools 弃用，硬期限 2027-02-18）
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["occupational-health", "GBZ188", "compliance", "surveillance", "offline"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
# 核心运行时：**零第三方依赖**（NFR-3 / 决策 D-07）
dependencies = []

[project.optional-dependencies]
# 桌面界面（M5）。迭代 D-3：Python 3.8 已 EOL，floor 抬到 3.12，
# 原先"3.8 上 PySide6 有硬上限"的 <6.7 约束不再需要；实测 6.12.0 全绿。
gui = ["PySide6>=6.12,<7"]
# 打包（M5）。打 GUI 必须 PyInstaller >= 6（决策 D-14）；上界 <7 防未知大版本漂移（D-3）。
build = ["PyInstaller>=6.0,<7"]
# dev 须与 CI 同 extras 集合：test_scaffold 的 CI 守门测试解析 ci.yml 需要 PyYAML
# （M6-2 干净环境验证实测发现 L-1：主环境恰好装了 PyYAML 掩盖了缺失，干净 venv 直接红）
dev = ["pytest>=7.0", "PyYAML>=5.4"]

[project.urls]
Homepage = "https://github.com/yuluo554/occupational-health-surveillance-checker"
Repository = "https://github.com/yuluo554/occupational-health-surveillance-checker"

[project.scripts]
ohscheck = "ohscheck.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
