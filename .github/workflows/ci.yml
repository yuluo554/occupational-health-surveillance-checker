name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 2 矩阵：{ubuntu, windows} × {3.12}（迭代 D-3：Python 3.8 已 EOL，floor 抬到 3.12）
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 历史扫描类守门测试依赖全量历史；浅克隆会让扫描静默空转（决策 D-40）
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Frozen artifacts regenerate byte-identical
        run: |
          python tools/gen_rulesets.py --check
          python tools/gen_cases.py --check
          python tools/gen_synthetic.py --check

      - name: Zero-literal gate (with positive control)
        run: |
          python tools/check_literals.py --selftest
          python tools/check_literals.py

      - name: Sensitive-data audit gate (plan/ included)
        # 迭代 D-1：plan/ 不再整目录豁免；历史扫描依赖 fetch-depth: 0（决策 D-40）
        run: |
          python tools/audit_sensitive.py --selftest
          python tools/audit_sensitive.py

      - name: Tests
        run: python -m pytest -q

      - name: Selfcheck
        run: python -m ohscheck selfcheck

      - name: Benchmarks
        run: python -m ohscheck bench

      - name: CLI smoke
        run: |
          python -m ohscheck version
          python -m ohscheck compare
